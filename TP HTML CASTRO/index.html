        <!-- VISTA: PANEL DE JUNTA ELECTORAL (Actualizado según Res 124/2010) -->
        <section id="vista-admin-panel" class="vista">
            <h3>Panel de Junta Electoral - IPEM 38</h3>
            <p class="grey-text">Gestión exclusiva para autoridades de la Junta (Art. 25 y 26).</p>
            
            <div class="row">
                <!-- FORMULARIO CARGA DE LISTAS (Art. 28) -->
                <div class="col s12 m6">
                    <div class="card-panel">
                        <h5>Oficializar Nueva Lista</h5>
                        <div class="input-field">
                            <input type="number" id="input-numero" placeholder="Ej: 10">
                            <label class="active">Número de Lista</label>
                        </div>
                        <div class="input-field">
                            <input type="text" id="input-nombre-partido" placeholder="Ej: Frente Estudiantil Unido">
                            <label class="active">Nombre del Partido / Lista</label>
                        </div>
                        <div class="input-field">
                            <input type="text" id="input-presidente" placeholder="Ej: Axel Castro">
                            <label class="active">Candidato/a a Presidente</label>
                        </div>
                        <div class="input-field">
                            <input type="text" id="input-vicepresidente" placeholder="Ej: María Gómez">
                            <label class="active">Candidato/a a Vicepresidente</label>
                        </div>
                        <div class="input-field">
                            <input type="text" id="input-curso" placeholder="Ej: 5to Año A">
                            <label class="active">Curso de los candidatos</label>
                        </div>
                        
                        <label>Color de la Boleta</label>
                        <select class="browser-default" id="input-color" style="margin-bottom: 15px;">
                            <option value="" disabled selected>Elige un color</option>
                            <option value="red">Rojo</option>
                            <option value="blue">Azul</option>
                            <option value="green">Verde</option>
                            <option value="orange">Naranja</option>
                            <option value="purple">Morado</option>
                        </select>

                        <!-- Requisito Legal: Aval del 10% del padrón -->
                        <p>
                            <label>
                                <input type="checkbox" id="check-aval" class="filled-in" />
                                <span>Presenta aval escrito del 10% del padrón (Art. 28 inc. d)</span>
                            </label>
                        </p>
                        <br>
                        <button class="btn green w100" onclick="agregarLista()">Oficializar Lista</button>
                    </div>
                </div>

                <!-- ESTADO URNA Y LISTAS ACTIVAS -->
                <div class="col s12 m6">
                    <div class="card-panel blue darken-3 white-text center-align">
                        <h6>Estado de la Urna Digital</h6>
                        <h2 id="contador-votos" style="margin: 10px 0;">0</h2>
                        <p>Votos emitidos</p>
                    </div>
                    
                    <div class="card-panel">
                        <h5>Listas Oficializadas para Votar</h5>
                        <div id="admin-listas-activas">
                            <!-- JS llena esto -->
                        </div>
                        <br>
                        <button class="btn red w100" onclick="resetearUrna()">Reiniciar Elección (Borrar Todo)</button>
                    </div>
                </div>
            </div>
            <button class="btn grey" onclick="navegar('elecciones-portal')">Cerrar Panel</button>
        </section>
